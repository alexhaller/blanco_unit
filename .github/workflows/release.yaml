name: Release

on:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # required by the sigstore signing step below: without it the OIDC
      # token is never issued and ACTIONS_ID_TOKEN_REQUEST_TOKEN stays unset
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release zip
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          cd custom_components/blanco_unit
          zip blanco_unit.zip -r ./

      - name: Sign release package
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: sigstore/gh-action-sigstore-python@v3.2.0
        with:
          inputs: ${{ github.workspace }}/custom_components/blanco_unit/blanco_unit.zip

      - name: Upload zip to release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2.5.3
        with:
          tag_name: v${{ steps.semantic.outputs.new_release_version }}
          files: ${{ github.workspace }}/custom_components/blanco_unit/blanco_unit.zip
