name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install ruff mypy pip-audit
          pip install -r requirements.test.txt
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy custom_components/
      - name: pip-audit
        run: |
          python -c "import json; reqs=json.load(open('custom_components/blanco_unit/manifest.json'))['requirements']; open('_reqs_tmp.txt','w').write('\n'.join(reqs))"
          pip-audit -r _reqs_tmp.txt
          rm _reqs_tmp.txt
