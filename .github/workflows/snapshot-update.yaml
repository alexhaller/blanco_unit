name: Snapshot update

# Temporary, manually-triggered helper: regenerates the syrupy snapshots on
# Linux and uploads them as an artifact. It never writes to the repository.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Regenerate snapshots
        run: pytest tests --snapshot-update -q || true
      - name: Show diff
        run: git diff --stat -- tests/snapshots/
      - uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: tests/snapshots/
